name: Dreypella Campus CI

on:
  push:
    branches:
      - feature/complete-campus-platform
  pull_request:
    branches:
      - feature/complete-campus-platform

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible dependency security fixes
        run: npm audit fix
      - name: Verify dependency security
        run: npm audit --audit-level=low
      - name: Commit updated lockfile on development branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: resolve compatible npm audit vulnerabilities"
            git push
          fi
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
