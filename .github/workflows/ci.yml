name: Dreypella Campus CI

on:
  push:
    branches:
      - feature/complete-campus-platform
  pull_request:
    branches:
      - feature/complete-campus-platform

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; direct=' + item.isDirect + '; fix=' + JSON.stringify(item.fixAvailable)); console.log('Summary:', JSON.stringify(a.metadata?.vulnerabilities || {}))"
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
